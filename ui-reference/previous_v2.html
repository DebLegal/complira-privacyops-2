/* Complira PrivacyOps - original seven-module synthetic demo. No network, real uploads, or AI calls. */
const clone=v=>JSON.parse(JSON.stringify(v));
const BASE=JSON.parse(document.getElementById('seed').textContent);
let state=clone(BASE), view='overview', query='', persona='editor', activeModal='', pendingChecks=null;
const STORE_KEY='complira-original-privacyops-synthetic-v2';
try { const prior=JSON.parse(sessionStorage.getItem(STORE_KEY)||'null'); if(prior&&prior.schemaVersion===BASE.schemaVersion&&Array.isArray(prior.processing_activities))state=prior; } catch(_){}
const $=id=>document.getElementById(id);
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
const fmt=v=>String(v||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>new Date().toISOString();
const active=a=>!a.archived;
const getAct=id=>state.processing_activities.find(x=>x.id===id);
const getVen=id=>state.vendors.find(x=>x.id===id);
const currentNotice=()=>state.notice_versions.find(x=>String(x.status).startsWith('current'));
const openFindings=()=>state.findings.filter(f=>f.state!=='closed');
const openActions=()=>state.remediation_actions.filter(a=>a.state!=='closed');
const NAV=[['overview','▦','Overview'],['processing','▤','Processing register'],['vendors','◇','Vendors & DPAs'],['notices','▣','Notice versions'],['changes','↗','Change control'],['findings','⚑','Findings & actions'],['reports','▥','Reports']];
function save(){try{sessionStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(_){} }
function event(type,subject,detail){state.audit_events.push({id:'EVT-'+String(state.audit_events.length+1).padStart(4,'0'),timestamp:now(),persona,kind:type,subject_id:subject,detail});}
function commit(type,subject,detail){event(type,subject,detail);save();render();}
function idFor(key,prefix){return prefix+'-'+String(Math.max(0,...state[key].map(x=>Number((x.id||'').match(/(\d+)$/)?.[1]||0)))+1).padStart(3,'0')}
function pill(value){let v=String(value||'Unspecified'),cls=/high|missing|overdue|rejected/i.test(v)?'high':/open|pending|review|suggested|draft|undetermined/i.test(v)?'review':/closed|current|approved|verified/i.test(v)?'good':'info';return `<span class="badge ${cls}">${h(fmt(v))}</span>`}

function fArea(label,name,value='',required=false){return `<label class="field span2">${h(label)}<textarea name="${h(name)}" ${required?'required':''}>${h(value)}</textarea></label>`}
function fSelect(label,name,options,selected='',required=true){return `<label class="field">${h(label)}<select name="${h(name)}" ${required?'required':''}>${options.map(([v,t])=>`<option value="${h(v)}" ${v===selected?'selected':''}>${h(t)}</option>`).join('')}</select></label>`}

function actOptions(){return optionsBlank(state.processing_activities.filter(active).map(a=>[a.id,`${a.id} · ${a.name}`]),'No linked activity')}

function modal(title,body,footer='',submit=''){activeModal=title;$('modal-root').innerHTML=`<div class="modal-overlay" role="presentation" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${h(title)}"><header class="modal-head"><div><div class="eyebrow">COMPLIRA PRIVACYOPS</div><h2>${h(title)}</h2></div><button class="x" aria-label="Close dialog" onclick="closeModal()">×</button></header><div class="modal-body">${body}</div><footer class="modal-foot">${button('Cancel','closeModal()')}${footer}</footer></section></div>`;let focus=$('modal-root').querySelector('input,select,textarea,button');focus?.focus()}

function openActivity(id=''){let a=getAct(id)||{};let vendors=state.vendors.filter(active);modal(id?`Edit ${id}`:'Add processing activity',`<form id="activity-form" onsubmit="saveActivity(event)"><div class="formgrid">${fInput('Activity name','name',a.name||'',true)}${fInput('Purpose','purpose',a.purpose||'',true)}${fArea('Personal data categories (comma separated)','data_categories',arr(a.data_categories).join(', '),true)}${fInput('Source system','source_system',a.source_system||'',true)}${fInput('Responsible owner','owner_team',a.owner_team||'',true)}${fInput('Retention evidence / description','retention_description',a.retention_description||'Not established')}${fSelect('Review status','review_status',[['requires_document_review','Needs document review'],['reviewed','Reviewed (metadata only)'],['new','New']],a.review_status||'requires_document_review')}<div class="field span2"><b>Linked vendors (multiple allowed)</b><div class="checkgroup">${state.vendors.filter(active).map(v=>`<label class="check"><input type="checkbox" name="vendor_link" value="${h(v.id)}" ${arr(a.vendor_ids).includes(v.id)?'checked':''}/> ${h(v.id)} · ${h(v.name)}</label>`).join('')}</div></div></div><input type="hidden" name="id" value="${h(id)}"/></form>`,button('Save activity',"document.getElementById('activity-form').requestSubmit()",true))}
function saveActivity(ev){ev?.preventDefault();let z=fields($('activity-form'));if(!String(z.name).trim()||!String(z.purpose).trim()||!String(z.owner_team).trim())return notify('Name, purpose and owner are required');let id=String(z.id||'')||idFor('processing_activities','ACT');let old=getAct(id);let r={organization_id:BASE.organizations[0].id,id,name:String(z.name).trim(),purpose:String(z.purpose).trim(),data_categories:String(z.data_categories).split(',').map(x=>x.trim()).filter(Boolean),source_system:String(z.source_system).trim(),owner_team:String(z.owner_team).trim(),retention_description:String(z.retention_description).trim()||'Not established',retention_verified:false,lawful_ground_review_status:'not_assessed',review_status:z.review_status,vendor_ids:Array.from($('activity-form').querySelectorAll('input[name="vendor_link"]:checked')).map(x=>x.value),version:(old?.version||0)+1,archived:old?.archived||false};if(old)Object.assign(old,r);else state.processing_activities.push(r);state.vendors.forEach(v=>{v.activity_ids=arr(v.activity_ids).filter(x=>x!==id);if(r.vendor_ids.includes(v.id))v.activity_ids.push(id)});closeModal();commit(old?'update_activity':'create_activity',id,r.name);notify('Processing record saved')}
function activityDetail(id){let a=getAct(id);if(!a)return;modal(`${id} · ${a.name}`,`<div class="kv"><b>Purpose</b><div>${h(a.purpose)}</div><b>Data categories</b><div>${h(arr(a.data_categories).join(', '))}</div><b>Source system</b><div>${h(a.source_system)}</div><b>Owner</b><div>${h(a.owner_team)}</div><b>Retention</b><div>${h(a.retention_description)}</div><b>Linked vendor</b><div>${h(arr(a.vendor_ids).join(', ')||'None')}</div><b>Version</b><div>${h(a.version)}</div></div><div class="aside-note">This is a register entry; source documents and production systems have not been verified.</div>`,button('Edit',`closeModal();openActivity('${id}')`,true))}
function openVendor(id=''){let v=getVen(id)||{};modal(id?`Edit ${id}`:'Add vendor',`<form id="vendor-form" onsubmit="saveVendor(event)"><div class="formgrid">${fInput('Vendor name','name',v.name||'',true)}${fSelect('Provisional role','provisional_role',[['Undetermined','Undetermined'],['Processor (provisional)','Processor (provisional)'],['Fiduciary (provisional)','Fiduciary (provisional)'],['Other / review required','Other / review required']],v.provisional_role||'Undetermined')}${fSelect('Contract evidence','contract_evidence_status',[['not_established_from_register','Not established from register'],['provided_pending_review','Provided, pending review'],['reviewed_metadata_only','Reviewed metadata only']],v.contract_evidence_status||'not_established_from_register')}${fInput('Renewal date','renewal_date',v.renewal_date||'','', 'date')}${fInput('Next review date','next_review_date',v.next_review_date||'','', 'date')}${fInput('Owner','owner_team',v.owner_team||'',true)}<div class="field span2"><b>Linked activities (multiple allowed)</b><div class="checkgroup">${state.processing_activities.filter(active).map(a=>`<label class="check"><input type="checkbox" name="activity_link" value="${h(a.id)}" ${arr(v.activity_ids).includes(a.id)?'checked':''}/> ${h(a.id)} · ${h(a.name)}</label>`).join('')}</div></div></div><input type="hidden" name="id" value="${h(id)}"/></form>`,button('Save vendor',"document.getElementById('vendor-form').requestSubmit()",true))}

function openNotice(id=''){let n=state.notice_versions.find(x=>x.id===id)||{};let next='NOTICE-v'+(Math.max(...state.notice_versions.map(n=>Number(n.id.match(/(\d+)$/)?.[1]||0)))+1);let vnum=n.version_label||'v'+next.split('v').pop()+'.0';let selections=state.processing_activities.filter(active).map(a=>`<label class="check"><input type="checkbox" name="mapped" value="${h(a.id)}" ${arr(n.mapped_activity_ids).includes(a.id)?'checked':''}/> ${h(a.id)} · ${h(a.purpose)}</label>`).join('');modal(id?`Edit notice ${n.version_label}`:'Create notice draft',`<form id="notice-form" onsubmit="saveNotice(event)"><div class="formgrid">${fInput('Version label','version_label',vnum,true)}${fInput('Title','title',n.title||'Website privacy notice',true)}${fArea('Purpose summary','purpose_summary',n.purpose_summary||'',false)}<div class="field span2"><b>Mapped processing activities</b><div class="checkgroup">${selections}</div><small>Register metadata only; this does not change your website notice.</small></div></div><input type="hidden" name="id" value="${h(id)}"/></form>`,button('Save draft',"document.getElementById('notice-form').requestSubmit()",true))}
function saveNotice(ev){ev.preventDefault();let form=$('notice-form'),z=fields(form);if(!String(z.title||'').trim())return notify('Title required');let id=z.id||'NOTICE-v'+(Math.max(...state.notice_versions.map(n=>Number(n.id.match(/(\d+)$/)?.[1]||0)))+1),old=state.notice_versions.find(n=>n.id===id);if(old&&!['draft','rejected'].includes(old.status))return notify('Approved/pending notice cannot be edited');let mapped=Array.from(form.querySelectorAll('input[name="mapped"]:checked')).map(x=>x.value);let r={organization_id:BASE.organizations[0].id,id,notice_id:'NOTICE-website',title:String(z.title).trim(),version_label:String(z.version_label||'').trim(),recorded_date:today(),mapped_activity_ids:mapped,purpose_summary:String(z.purpose_summary||'').trim(),status:'draft',actual_published_notice_verified:false,source_document_id:null,version:(old?.version||0)+1};if(old)Object.assign(old,r);else state.notice_versions.unshift(r);closeModal();commit('save_notice_draft',id,r.version_label);notify('Notice draft saved')}
function noticeDetail(id){let n=state.notice_versions.find(x=>x.id===id);if(!n)return;modal(`Notice ${n.version_label}`,`<div class="kv"><b>Title</b><div>${h(n.title)}</div><b>Status</b><div>${pill(n.status)}</div><b>Mapped activities</b><div>${h(arr(n.mapped_activity_ids).join(', ')||'None')}</div><b>Summary</b><div>${h(n.purpose_summary||'No summary')}</div><b>Recorded</b><div>${h(n.recorded_date)}</div></div><div class="aside-note">This register record does not represent a live website publication.</div>`,button('Compare',`closeModal();compareNotice('${id}')`,true))}
function compareNotice(id){let n=state.notice_versions.find(x=>x.id===id),reference=currentNotice();if(!n)return;let newIds=arr(n.mapped_activity_ids),oldIds=arr(reference?.mapped_activity_ids);let added=newIds.filter(x=>!oldIds.includes(x)),removed=oldIds.filter(x=>!newIds.includes(x));modal(`Compare ${n.version_label} with current`, `<div class="cols-2"><div class="info-card"><strong>${h(n.version_label)}</strong><p>${h(newIds.join(', ')||'No purposes mapped')}</p></div><div class="info-card"><strong>${h(reference?.version_label||'No current')}</strong><p>${h(oldIds.join(', ')||'No purposes mapped')}</p></div></div><div class="detail"><h3>Purpose map differences</h3><p><b>Added:</b> ${h(added.join(', ')||'None')}</p><p><b>Removed:</b> ${h(removed.join(', ')||'None')}</p></div><div class="aside-note">Metadata comparison only. Actual legal sufficiency must be determined separately.</div>`,n.status==='draft'?button('Submit review',`closeModal();submitNotice('${id}')`,true):'')}
function submitNotice(id){let n=state.notice_versions.find(x=>x.id===id);if(!n||!['draft','rejected'].includes(n.status))return notify('Only drafts can be submitted');n.status='pending_review';commit('submit_notice_review',id,n.version_label);notify('Notice submitted for simulated review')}
function reviewNotice(id){let n=state.notice_versions.find(x=>x.id===id);if(!n||n.status!=='pending_review')return notify('No pending review');if(persona!=='reviewer')return notify('Switch to Reviewer (Demo) for this decision');modal(`Review ${n.version_label}`,`<form id="notice-review"><label class="field">Reviewer rationale<textarea name="reason" required placeholder="Document the decision and limitations"></textarea></label></form><div class="aside-note" style="margin-top:13px">An approval changes the current version inside this fictional register, not the real website or statutory compliance status.</div>`,button('Reject',`decideNotice('${id}','reject')`)+button('Approve',`decideNotice('${id}','approve')`,true))}
function decideNotice(id,decision){if(persona!=='reviewer')return notify('Reviewer persona required');let reason=formValue($('notice-review'),'reason');if(reason.length<8)return notify('Enter a reviewer rationale of at least 8 characters');let n=state.notice_versions.find(x=>x.id===id);if(!n||n.status!=='pending_review')return; if(decision==='approve'){state.notice_versions.forEach(x=>{if(String(x.status).startsWith('current'))x.status='archived'});n.status='current_recorded'}else n.status='rejected';state.review_decisions.push({id:idFor('review_decisions','DEC'),subject_id:id,decision,reason,persona,timestamp:now()});closeModal();commit('review_notice',id,decision+': '+reason);notify('Notice decision recorded (demo)')}

function saveChange(ev){ev.preventDefault();let z=fields($('change-form'));if(!z.title?.trim()||!z.owner_team?.trim())return notify('Title and owner are required');let id=idFor('change_requests','CHG');let c={organization_id:BASE.organizations[0].id,id,change_type:z.change_type,title:z.title.trim(),owner_team:z.owner_team.trim(),activity_id:z.activity_id||'',vendor_id:z.vendor_id||'',recorded_date:today(),state:'new',notes:z.notes?.trim()||'',version:1};state.change_requests.push(c);closeModal();commit('create_change',id,c.title);notify(`${id} created`);checkChange(id)}
function openChangeDetail(id){let c=state.change_requests.find(x=>x.id===id);if(!c)return;let hits=state.findings.filter(f=>f.change_id===id);modal(`${id} · ${c.title}`,`<div class="kv"><b>Type</b><div>${h(c.change_type)}</div><b>Owner</b><div>${h(c.owner_team)}</div><b>Activity</b><div>${h(c.activity_id||'None')}</div><b>Vendor</b><div>${h(c.vendor_id||'None')}</div><b>Status</b><div>${pill(c.state)}</div><b>Findings</b><div>${hits.length}</div><b>Notes</b><div>${h(c.notes||'None')}</div></div><div class="aside-note">Rechecks are idempotent: identical source versions and rule IDs cannot create duplicate actionable findings.</div>`,button('Run checks',`closeModal();checkChange('${id}')`,true))}
function source(a,v,n){return {a:a?`${a.id} v${a.version} · ${a.purpose}`:'Activity not linked',b:v?`${v.id} v${v.version} · ${fmt(v.contract_evidence_status)}`:n?`${n.id} v${n.version} · purpose map`:'Not established from register'}}
function makeRule(rule,title,subject,a,v,n,action,severity='Medium',note=''){return {rule_id:rule,title,subject_id:subject,source_a_metadata:a?`${a.id} v${a.version} · ${a.name} · ${a.purpose}`:(v?`${v.id} v${v.version} · ${v.name}`:'No processing activity linked'),source_b_metadata_or_absence:note||(v?`${v.id} v${v.version} · ${fmt(v.contract_evidence_status)}`:n?`${n.id} · register metadata`:'Not established from provided register'),suggested_action:action,suggested_severity:severity,provision_text_unverified:'Relevant DPDP Act/Rules provisions require professional verification',is_verified_legal_finding:false}}
function evaluate(c){let a=getAct(c.activity_id),v=getVen(c.vendor_id),n=currentNotice(),hits=[],todayDate=today();const push=(...args)=>hits.push(makeRule(...args));
if(a&&!a.owner_team?.trim())push('MAP_OWNERSHIP_MISSING','Activity has no recorded owner',a.id,a,v,n,'Assign a responsible data owner');
if(v&&v.contract_evidence_status==='not_established_from_register')push('VENDOR_CONTRACT_EVIDENCE_MISSING','Vendor contract evidence not established',v.id,a,v,n,'Request and verify contract evidence','High','No contract evidence in synthetic register; does not prove no contract exists');
if(v&&v.renewal_date&&v.renewal_date>=todayDate&&Math.round((new Date(v.renewal_date)-new Date(todayDate))/86400000)<=30)push('VENDOR_RENEWAL_DUE','Vendor renewal due within 30 days',v.id,a,v,n,'Review renewal terms and evidence');
if(a&&n&&!arr(n.mapped_activity_ids).includes(a.id))push('NOTICE_PURPOSE_MISMATCH','Processing purpose missing from mapped notice',a.id,a,v,n,'Verify actual notice and review purpose mapping','High',`${n.id} v${n.version} lacks ${a.id} in mapped activity IDs`);
if(a&&v&&Array.isArray(n?.recipient_vendor_ids)&&!n.recipient_vendor_ids.includes(v.id))push('NOTICE_RECIPIENT_MISMATCH','Mapped vendor omitted from notice-recipient metadata',v.id,a,v,n,'Review recipient disclosure and notice evidence');
if(a&&(!a.retention_description||/not established|undefined|unknown/i.test(a.retention_description)))push('RETENTION_RULE_UNDEFINED','Retention description not established',a.id,a,v,n,'Validate retention period, exceptions and erasure requirements','Medium',`${a.id}: ${a.retention_description||'No retention description recorded'}`);
if(v&&/undetermined|unknown/i.test(v.provisional_role))push('VENDOR_ROLE_UNDETERMINED','Vendor processing role not determined',v.id,a,v,n,'Review roles and contractual allocation','Medium',`${v.id}: ${v.provisional_role}`);
if(v&&v.contract_evidence_status==='provided_pending_review')push('EVIDENCE_NOT_VERIFIED','Vendor contract evidence pending review',v.id,a,v,n,'Review document evidence before relying on the record');
if(state.remediation_actions.some(t=>t.finding_id&&t.due_date&&t.due_date<todayDate&&t.state!=='closed'&&state.findings.some(f=>f.id===t.finding_id&&[a?.id,v?.id].includes(f.subject_id))))push('REMEDIATION_OVERDUE','Linked remediation action overdue',a?.id||v?.id,a,v,n,'Escalate outstanding remediation task');
if(v&&v.next_review_date&&v.next_review_date<todayDate)push('REVIEW_OVERDUE','Vendor review overdue',v.id,a,v,n,'Schedule vendor review and record outcome');
return hits.map(r=>({...r,fingerprint:[c.id,r.rule_id,a?.id,a?.version,v?.id,v?.version,n?.id,n?.version].join('|')}))}
function checkChange(id){let c=state.change_requests.find(x=>x.id===id);if(!c)return;let rules=evaluate(c);pendingChecks={id,rules};let list=rules.length?rules.map(x=>`<li><span class="dot"></span><div><b>${h(x.title)}</b> ${pill(x.suggested_severity)}<div class="muted small">${h(x.rule_id)} · ${h(x.source_b_metadata_or_absence)}</div></div></li>`).join(''):'<li>No metadata mismatch detected. Human review may still be required.</li>';modal(`Review checks · ${id}`,`<p>Change: <b>${h(c.title)}</b> · ${h(c.change_type)}</p><div class="flow"><span>${h(c.activity_id||'No ACT')}</span><b>→</b><span>${h(c.vendor_id||'No vendor')}</span><b>→</b><span>Human review</span></div><ul class="checklist">${list}</ul><div class="aside-note">These checks inspect register fields only; no actual legal breach is asserted.</div>`,button('Record review request',`recordChange('${id}')`,true))}
function recordChange(id){let c=state.change_requests.find(x=>x.id===id);if(!c)return;let rules=pendingChecks?.id===id?pendingChecks.rules:evaluate(c);let added=0;for(let r of rules){if(state.findings.some(f=>f.fingerprint===r.fingerprint))continue;let fId=idFor('findings','FND');let f={organization_id:BASE.organizations[0].id,id:fId,title:r.title,area:'Change review',suggested_severity:r.suggested_severity.toLowerCase(),confirmed_severity:null,state:'suggested_pending_review',owner_team:c.owner_team,due_date:'',subject_id:r.subject_id,source_a_metadata:r.source_a_metadata,source_b_metadata_or_absence:r.source_b_metadata_or_absence,provision_text_unverified:r.provision_text_unverified,suggested_action:r.suggested_action,verified_source_quote:null,is_verified_legal_finding:false,version:1,change_id:id,rule_id:r.rule_id,fingerprint:r.fingerprint};state.findings.push(f);state.remediation_actions.push({organization_id:BASE.organizations[0].id,id:idFor('remediation_actions','TASK'),finding_id:fId,title:r.suggested_action,owner_team:c.owner_team,due_date:'',state:'open',evidence_record_ids:[],submitted_for_approval:false,version:1});added++}c.state='review_requested';event('change_check',id,`${rules.length} suggestions; ${added} new findings`);save();closeModal();render();notify(`${id}: ${added} new findings, ${rules.length-added} already recorded`)}
function openFinding(id){let f=state.findings.find(x=>x.id===id);if(!f)return;let ts=state.remediation_actions.filter(t=>t.finding_id===id);let ev=state.evidence_records.filter(x=>x.finding_id===id);let dec=state.review_decisions.filter(x=>x.subject_id===id);let buttons=[button('Add / edit action',`closeModal();openTask('','${id}')`)];if(f.state!=='closed'){if(f.state!=='pending_closure')buttons.push(button('Request closure',`closeModal();requestClosure('${id}')`,true));else if(persona==='reviewer')buttons.push(button('Review closure',`closeModal();reviewClosure('${id}')`,true));}else if(persona==='reviewer')buttons.push(button('Reopen',`reopenFinding('${id}')`));modal(`${f.id} · ${f.title}`,`<div class="kv"><b>Suggested severity</b><div>${pill(f.suggested_severity)}</div><b>State</b><div>${pill(f.state)}</div><b>Owner</b><div>${h(f.owner_team)}</div><b>Subject</b><div>${h(f.subject_id)}</div><b>Source A</b><div>${h(f.source_a_metadata)}</div><b>Source B / absence</b><div>${h(f.source_b_metadata_or_absence)}</div><b>Proposed action</b><div>${h(f.suggested_action)}</div><b>Reference (unverified)</b><div>${h(f.provision_text_unverified)}</div></div><div class="detail"><h3>Linked remediation</h3>${ts.map(t=>`<p><b>${h(t.id)}:</b> ${h(t.title)} · ${pill(t.state)} ${textButton('Edit',`closeModal();openTask('${t.id}')`)}</p>`).join('')||'<p>None</p>'}</div><div class="detail"><h3>Evidence and decision history</h3>${ev.map(x=>`<p class="small">${h(x.reference)} · ${h(x.note)} · ${h(x.timestamp)}</p>`).join('')||'<p class="small">No evidence metadata yet.</p>'}${dec.map(x=>`<p class="small"><b>${h(x.decision)}</b> · ${h(x.reason)} · ${h(x.timestamp)}</p>`).join('')||''}</div><div class="aside-note">Severity is a review suggestion, not a verified legal finding. Evidence is fictional metadata, not uploaded customer documents.</div>`,buttons.join(''))}
function openTask(id='',finding=''){let a=state.remediation_actions.find(x=>x.id===id)||{};let opts=state.findings.map(f=>[f.id,`${f.id} · ${f.title}`]);modal(id?`Edit ${id}`:'Create remediation action',`<form id="task-form" onsubmit="saveTask(event)"><div class="formgrid">${fSelect('Linked finding','finding_id',opts,a.finding_id||finding)}${fInput('Action title','title',a.title||'',true)}${fInput('Responsible owner','owner_team',a.owner_team||'Operations',true)}${fInput('Due date','due_date',a.due_date||'','', 'date')}${fSelect('Status','state',[['open','Open'],['in_progress','In progress'],['blocked','Blocked']],['closed','pending_closure'].includes(a.state)?'open':(a.state||'open'))}</div><input type="hidden" name="id" value="${h(id)}"/></form>`,button('Save action',"document.getElementById('task-form').requestSubmit()",true))}
function saveTask(ev){ev.preventDefault();let z=fields($('task-form')),id=z.id||idFor('remediation_actions','TASK'),old=state.remediation_actions.find(x=>x.id===id);if(!String(z.title).trim()||!String(z.owner_team).trim())return notify('Title and owner required');let r={organization_id:BASE.organizations[0].id,id,finding_id:z.finding_id,title:String(z.title).trim(),owner_team:String(z.owner_team).trim(),due_date:z.due_date||'',state:z.state,evidence_record_ids:old?.evidence_record_ids||[],submitted_for_approval:false,version:(old?.version||0)+1};if(old)Object.assign(old,r);else state.remediation_actions.push(r);closeModal();commit(old?'update_task':'create_task',id,r.title);notify('Action saved')}

function submitClosure(id){if(persona!=='editor')return notify('Only demo Editor may submit closure request');let ref=formValue($('closure-form'),'reference'),note=formValue($('closure-form'),'note');if(ref.length<4||note.length<8)return notify('Evidence reference and explanation (8+ chars) required');let f=state.findings.find(x=>x.id===id);if(!f)return;let evidId=idFor('evidence_records','EVD');state.evidence_records.push({organization_id:BASE.organizations[0].id,id:evidId,finding_id:id,reference:ref,note,persona,timestamp:now(),source_verified:false});f.state='pending_closure';f.version=(f.version||1)+1;state.remediation_actions.filter(t=>t.finding_id===id).forEach(t=>{t.state='pending_closure';t.evidence_record_ids=arr(t.evidence_record_ids).concat(evidId)});closeModal();commit('closure_requested',id,ref);notify('Closure request submitted for simulated reviewer')}

function reopenFinding(id){if(persona!=='reviewer')return notify('Reviewer persona required');let f=state.findings.find(x=>x.id===id);if(!f||f.state!=='closed')return;modal(`Reopen ${id}`,`<form id="reopen-form"><label class="field">Reason<textarea name="reason" required></textarea></label></form>`,button('Reopen finding',`confirmReopen('${id}')`,true))}

function toggleMobile(open){let on=Boolean(open);document.getElementById('sidebar')?.classList.toggle('mobile-open',on);document.querySelector('.mobile-backdrop')?.classList.toggle('mobile-open',on)}
function openDemoLimitations(){modal('Demo scope & limitations',`<div class="stack"><p><b>Fictional MapleStack SaaS</b> is a synthetic test workspace. No actual customer contracts, security controls or live systems have been reviewed.</p><p>All review checks inspect entered register metadata only and generate provisional suggestions. They are not automatic legal conclusions, audits, certifications or legal advice.</p><p>Editor and Reviewer are simulated personas, not real authentication. Records remain in browser session storage. Never enter private customer data into this file.</p></div>`,button('Understood','closeModal()',true))}
function openGuidedTour(){modal('A simpler way to manage privacy work',`<div class="stack"><div class="info-card"><strong>01. Keep your source records current</strong><p>Document personal-data uses and link the processors who handle them.</p>${button('Processing register',"closeModal();navigate('processing')")}</div><div class="info-card"><strong>02. Start a change review</strong><p>When a vendor, purpose or data field changes, check affected records and submit a review.</p>${button('New change',"closeModal();openChange()",true)}</div><div class="info-card"><strong>03. Finish the loop</strong><p>Assign remediation, record evidence metadata, approve decisions and export your report.</p>${button('Findings & actions',"closeModal();navigate('findings')")}</div></div>`,button('Done','closeModal()'))}
const commandPages=[['overview','▦','Overview','Operational summary and next steps'],['processing','▤','Processing register','Data inventory and processing activities'],['vendors','◇','Vendors & DPAs','Processors and contract evidence'],['notices','▣','Notice versions','Purpose mapping and review'],['changes','↗','Change control','Start and manage processing changes'],['findings','⚑','Findings & actions','Remediation and decisions'],['reports','▥','Reports','Export current evidence and status']];
function openCommand(){let root=document.getElementById('command-root');root.innerHTML=`<div class="command-overlay" onclick="if(event.target===this)closeCommand()"><div class="command-dialog" role="dialog" aria-modal="true" aria-label="Quick navigation"><input id="command-input" class="command-search" aria-label="Search workspace pages and actions" placeholder="Where would you like to go?" autocomplete="off" oninput="drawCommands(this.value)"><div class="command-label">Navigate and act</div><div class="command-list" id="command-list"></div><div class="command-footer"><span>Enter to open · Escape to close</span><span>Complira PrivacyOps</span></div></div></div>`;drawCommands('');document.getElementById('command-input')?.focus()}
function drawCommands(q){const filtered=commandPages.filter(i=>i.join(' ').toLowerCase().includes((q||'').toLowerCase()));const actions=[['＋','Create a change','Start a guided review',"closeCommand();openChange()"],['＋','Add processing activity','Record data processing',"closeCommand();openActivity()"]].filter(i=>i.join(' ').toLowerCase().includes((q||'').toLowerCase()));document.getElementById('command-list').innerHTML=filtered.map(x=>`<button class="command-item" onclick="closeCommand();navigate('${x[0]}')"><span class="command-key">${x[1]}</span><span>${h(x[2])}<small>${h(x[3])}</small></span></button>`).join('')+actions.map(a=>`<button class="command-item" onclick="${a[3]}"><span class="command-key">${a[0]}</span><span>${h(a[1])}<small>${h(a[2])}</small></span></button>`).join('')||'<div class="empty">No matching pages or actions</div>'}
function closeCommand(){document.getElementById('command-root').innerHTML=''}
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();openCommand()}if(ev.key==='Escape'&&document.getElementById('command-root').children.length)closeCommand()});
render();
</script></body></html>
