{padding:19px 21px;background:white;border:1px solid var(--line);border-radius:11px}.metric .label{font-size:11px;color:#758591;font-weight:650}.metric .value{font-size:31px;font-weight:750;letter-spacing:-1px;line-height:1.25;margin-top:7px;color:var(--navy)}.metric .desc{font-size:11px;color:var(--muted);margin-top:7px}.stat-icon{float:right;color:#849aa8;font-size:17px}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:5px;font-size:10px;font-weight:780;white-space:nowrap;background:#f1f4f6;color:#516b7b}.badge.high{color:#a83b2e;background:#fff0ed}.badge.medium{color:#9b6528;background:#fff5e8}.badge.good{background:#e8f7f0;color:#196d49}.badge.info{color:#275c8f;background:#edf6ff}.badge.review{color:#986018;background:#fff5e8}.stack{display:flex;flex-direction:column;gap:11px}.queue-item{padding:15px 18px;border-bottom:1px solid #ecf0f3;display:flex;gap:12px;align-items:flex-start;cursor:pointer}.queue-item:hover{background:#fcfdfe}.queue-item:last-child{border-bottom:0}.queue-icon{background:#fff1e8;color:#bd6124;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:14px}.queue-item h3{font-size:13px;line-height:1.4;margin:0 0 4px;font-weight:730}.queue-item p{font-size:11px;color:var(--muted);margin:0}.queue-item .right{margin-left:auto;flex:none}.progressrow{margin:17px 0}.progressrow .pair{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px}.progress{height:7px;background:#eaf0f4;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--orange);border-radius:20px}.aside-note{background:#fffaf6;border:1px solid #f5ddca;padding:14px;border-radius:8px;color:#714c2e;font-size:12px}.table-wrap{overflow:auto}.data-table{border-collapse:collapse;width:100%;font-size:12px;min-width:680px}.data-table th{text-align:left;background:#f8fafb;padding:12px 16px;border-bottom:1px solid var(--line);color:#6f8390;font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:800}.data-table td{padding:14px 16px;border-bottom:1px solid #ecf0f3;vertical-align:top}.data-table tr:last-child td{border-bottom:0}.data-table tbody tr:hover{background:#fcfdff}.text-link{border:0;background:none;color:#1e5d87;padding:0;font-weight:700;text-align:left}.text-link:hover{text-decoration:underline}.muted{color:var(--muted)}.small{font-size:11px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 19px;border-bottom:1px solid var(--line)}.toolbar input,.toolbar select{border:1px solid #d7e1e8;border-radius:7px;padding:9px 11px;background:white;max-width:240px;min-width:0}.toolbar input{flex:1}.empty{padding:32px;text-align:center;color:var(--muted)}.cols-2{display:grid;grid-template-columns:1fr 1fr;gap:17px}.info-card{padding:20px;border:1px solid var(--line);border-radius:9px}.info-card strong{display:block;margin-bottom:4px}.info-card p{color:var(--muted);font-size:12px}.info-card .meta{font-size:11px;margin-top:10px}.fine{color:var(--muted);font-size:11px}.flow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:18px 0}.flow span{padding:9px 12px;background:#f2f5f7;border:1px solid #e3eaf0;border-radius:6px;font-size:11px;font-weight:700}.flow b{color:var(--orange)}.detail{margin-top:18px;padding:19px;border:1px solid var(--line);background:#fcfdfe;border-radius:8px}.detail h3{font-size:14px;margin:0 0 10px}.kv{display:grid;grid-template-columns:155px 1fr;gap:10px;margin:8px 0;font-size:12px}.kv b{color:#526777}.evidence{background:#f4f8fb;border-left:3px solid #4d829e;padding:11px;margin:9px 0;font-size:12px}.evidence b{display:block;color:#416077;font-size:10px;letter-spacing:.3px;margin-bottom:4px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#465d6c}.field.span2{grid-column:span 2}.field input,.field select,.field textarea{border:1px solid #d3dfe7;border-radius:7px;padding:10px 11px;background:white;color:var(--ink);font-weight:450}.field textarea{min-height:76px;resize:vertical}.field small{font-weight:450;color:var(--muted)}.modal-overlay{position:fixed;inset:0;background:rgba(7,24,38,.56);z-index:30;display:flex;justify-content:center;align-items:center;padding:16px}.modal{background:white;width:min(650px,100%);max-height:91vh;overflow:auto;border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.2)}.modal-head{padding:20px 23px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);align-items:start}.modal-head h2{font-size:20px;margin:0}.modal-body{padding:23px}.modal-foot{padding:15px 23px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.x{background:none;border:0;font-size:24px;color:var(--muted);padding:0 5px}.callout{margin-bottom:19px;border:1px solid #c8dce9;border-radius:9px;padding:16px 19px;background:#f0f8fc;color:#36556c;font-size:12px}.snack{position:fixed;right:20px;bottom:20px;background:var(--navy);color:white;border-radius:8px;padding:13px 17px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:340px}.footer-note{font-size:11px;color:#83919d;padding:24px 0}.checklist{padding:0;margin:0;list-style:none}.checklist li{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.checklist li:last-child{border:0}.dot{width:8px;height:8px;background:var(--orange);border-radius:50%;display:inline-block;flex:none;margin-top:5px}.change-actions{display:flex;gap:6px;flex-wrap:wrap}.notice-box{background:#fcfdfe;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:10px}.notice-box h3{font-size:14px;margin:0}.notice-box p{font-size:12px}.notice-box small{color:var(--muted)}.none{display:none!important}@media(max-width:1190px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:800px){.app{display:block}.sidebar{position:relative;height:auto;width:auto}.brand{padding:12px 16px}.side-label,.sidebar-foot{display:none}.nav{flex-direction:row;overflow:auto;padding:8px;gap:4px}.nav button{white-space:nowrap;width:auto;padding:9px}.nav button .symbol{display:none}.top{top:0;padding:12px 15px}.workspace{display:none}.content{padding:23px 14px}.cols-2{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.span2{grid-column:span 1}.kv{grid-template-columns:110px 1fr}.top-right{gap:5px}h1{font-size:25px}}@media(max-width:450px){.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:12px}.metric .value{font-size:25px}.top .btn{padding:7px 9px;font-size:11px}.intro p{font-size:12px}}@media print{.sidebar,.top,.btn,.toolbar,.snack{display:none!important}.content{padding:0}.main{width:100%}.panel{break-inside:avoid}.app{display:block}body{background:white}}

<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">C</div><div><div class="brandname">complira</div><small>PRIVACYOPS</small></div></div><div class="side-label">Workspace</div><nav class="nav" id="navigation"></nav><div class="sidebar-foot"><b>MapleStack SaaS</b>Fictional example · browser-only demo<br/>Not suitable for client documents</div></aside><main class="main"><div class="top"><div class="crumb"><strong>PrivacyOps</strong> &nbsp;/&nbsp; <span id="crumb">Overview</span></div><div class="top-right"><span class="tiny-pill">SYNTHETIC DATA ONLY</span><span class="workspace">MapleStack SaaS ▾</span><button class="btn btn-primary" onclick="openChange()">＋ New change</button></div></div><div class="content" id="content" aria-live="polite"></div></main></div>
<div id="modal-root"></div><div id="snack" class="snack none" role="status"></div>
<script>
'use strict';
const RAW={activities:[
{id:'ACT-001',name:'User registration',purpose:'Account creation and access',data:'Name, email, account ID',system:'Product database',vendor:'CloudNest Hosting',owner:'Product',retention:'Account lifetime + documented exceptions',status:'Reviewed'},
{id:'ACT-002',name:'Customer support',purpose:'Service support and issue resolution',data:'Email, ticket content',system:'Helpdesk',vendor:'TicketWay',owner:'Operations',retention:'24 months (policy proposal)',status:'Needs review'},
{id:'ACT-003',name:'Product analytics',purpose:'Feature usage analytics',data:'Account ID, usage events',system:'Product SDK',vendor:'InsightBeacon',owner:'Engineering',retention:'Not established',status:'Needs review'},
{id:'ACT-004',name:'Lifecycle emails',purpose:'Account-related communications',data:'Email, notification preferences',system:'Messaging',vendor:'MailSwift',owner:'Growth',retention:'12 months (policy proposal)',status:'Reviewed'}],
vendors:[
{id:'VEN-001',name:'CloudNest Hosting',role:'Processor (provisional)',contract:'Provided · review pending',renewal:'2027-04-01',owner:'Engineering',status:'Review pending',activity:'ACT-001'},
{id:'VEN-002',name:'TicketWay',role:'Processor (provisional)',contract:'No agreement evidence provided',renewal:'2027-02-14',owner:'Operations',status:'Evidence missing',activity:'ACT-002'},
{id:'VEN-003',name:'InsightBeacon',role:'Undetermined',contract:'No agreement evidence provided',renewal:'2027-01-31',owner:'Engineering',status:'Evidence missing',activity:'ACT-003'},
{id:'VEN-004',name:'MailSwift',role:'Processor (provisional)',contract:'Provided · review pending',renewal:'2027-07-20',owner:'Growth',status:'Review pending',activity:'ACT-004'}],
notices:[{id:'NOTICE-v2',title:'Website privacy notice',version:'v2.0',date:'2026-10-17',purposes:'Account creation and access; service support and issue resolution; account-related communications',status:'Current · Needs review'},{id:'NOTICE-v1',title:'Website privacy notice',version:'v1.0',date:'2026-03-04',purposes:'Account creation and access; account-related communications',status:'Archived'}],
findings:[
{id:'FND-001',title:'Analytics purpose absent from mapped notice',area:'Notice ↔ data map',severity:'High',status:'Needs reviewer',owner:'Product',due:'2026-11-21',subject:'ACT-003',sourceA:'ACT-003 · Purpose: Feature usage analytics',sourceB:'NOTICE-v2 · Mapped purposes omit product analytics',provision:'DPDP Rules 2025, Rule 3 · effective 13 May 2027',action:'Validate actual notice wording, purpose and required change'},
{id:'FND-002',title:'Vendor contract evidence not established',area:'Vendor ↔ processing',severity:'High',status:'Needs reviewer',owner:'Operations',due:'2026-11-22',subject:'VEN-002',sourceA:'ACT-002 · Customer support processed in TicketWay',sourceB:'VEN-002 · No contract evidence in sample register',provision:'DPDP Act 2023, s.8(2) · effective 13 May 2027',action:'Obtain and review valid-contract evidence'},
{id:'FND-003',title:'Analytics retention period undefined',area:'Retention ↔ data map',severity:'Medium',status:'Open action',owner:'Engineering',due:'2026-11-27',subject:'ACT-003',sourceA:'ACT-003 · Retention: Not established',sourceB:'No supporting schedule in this simulated demo',provision:'DPDP Act 2023, s.8(7), subject to applicable retention rules',action:'Confirm retention purpose, period, legal exceptions and erasure flow'},
{id:'FND-004',title:'Processor classification requires review',area:'Vendor responsibility',severity:'Medium',status:'Open action',owner:'Engineering',due:'2026-11-29',subject:'VEN-003',sourceA:'VEN-003 · Role: Undetermined',sourceB:'ACT-003 · External analytics receives usage events',provision:'DPDP Act 2023, ss.2, 8 · interpretation requires review',action:'Review processor/fiduciary roles and contractual allocation'}],
actions:[{id:'TASK-001',finding:'FND-001',name:'Review purpose wording in published notice',owner:'Product',due:'2026-11-21',status:'In progress'},{id:'TASK-002',finding:'FND-002',name:'Request TicketWay contractual terms',owner:'Operations',due:'2026-11-22',status:'Open'},{id:'TASK-003',finding:'FND-003',name:'Agree analytics retention schedule',owner:'Engineering',due:'2026-11-27',status:'Open'}],
changes:[{id:'CHG-001',type:'New vendor',name:'Analytics onboarding',owner:'Engineering',created:'2026-11-12',status:'Needs review',activity:'ACT-003',vendor:'VEN-003'},{id:'CHG-002',type:'Updated notice',name:'Website privacy notice v2',owner:'Product',created:'2026-10-17',status:'Pending approval',activity:'ACT-001',vendor:''}]
};
let s=structuredClone(RAW),page='overview',filter='',detail=null,pendingReview=null;
const navItems=[['overview','▦','Overview'],['processing','▤','Processing register'],['vendors','◇','Vendors & DPAs'],['notices','▣','Notice versions'],['changes','↗','Change control'],['findings','⚑','Findings & actions'],['reports','▥','Reports']];
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));const badge=(value)=>{let c=/high|missing|overdue/i.test(value)?'high':/review|pending|open/i.test(value)?'review':/closed|reviewed|approved/i.test(value)?'good':'info';return `<span class="badge ${c}">${esc(value)}</span>`};const e=(txt)=>esc(txt);const panel=(title,body,right='')=>`<section class="panel"><div class="panel-head"><h2>${title}</h2>${right}</div>${body}</section>`;
function toast(msg){let t=$('snack');t.textContent=msg;t.classList.remove('none');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.add('none'),3500)}
function nav(p){page=p;filter='';detail=null;render();window.scrollTo(0,0)}
function render(){let current=navItems.find(n=>n[0]===page),head=current?current[2]:'Overview';$('crumb').textContent=head;$('navigation').innerHTML=navItems.map(n=>`<button class="${page===n[0]?'active':''}" onclick="nav('${n[0]}')" aria-current="${page===n[0]?'page':'false'}"><span class="symbol">${n[1]}</span>${n[2]}</button>`).join('');$('content').innerHTML=({overview:overview,processing:processing,vendors:vendors,notices:notices,changes:changes,findings:findings,reports:reports}[page]||overview)();}
const heading=(ey,title,desc,right='')=>`<div class="intro"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p>${desc}</p></div>${right}</div>`;
function overview(){let open=s.findings.filter(f=>f.status!=='Closed').length,unreviewed=s.vendors.filter(v=>v.status!=='Reviewed').length;return heading('Continuous privacy operations','Your privacy work, in one place','Track changing data flows, vendor contracts and unresolved work. Every conclusion needs a human reviewer.',`<button class="btn" onclick="resetDemo()">↺ Reset demo</button>`)+`<div class="callout"><b>Live legal timetable ≠ completed compliance.</b> Core DPDP obligations are scheduled for 13 May 2027. This is an entirely fictional demonstration, not a compliance assessment or an operational legal service.</div>`+`<div class="metrics"><div class="metric"><span class="stat-icon">▤</span><div class="label">Processing activities</div><div class="value">${s.activities.length}</div><div class="desc">Tracked data-handling workflows</div></div><div class="metric"><span class="stat-icon">◇</span><div class="label">Vendors tracked</div><div class="value">${s.vendors.length}</div><div class="desc">${unreviewed} awaiting evidence/review</div></div><div class="metric"><span class="stat-icon">⚑</span><div class="label">Open review findings</div><div class="value">${open}</div><div class="desc">Not legal breach determinations</div></div><div class="metric"><span class="stat-icon">↗</span><div class="label">Change requests</div><div class="value">${s.changes.length}</div><div class="desc">Source-linked change records</div></div></div><div class="layout"><div class="stack">${panel('Needs attention',`<div>${s.findings.filter(f=>f.status!=='Closed').slice(0,5).map(f=>`<div class="queue-item" onclick="showFinding('${f.id}')"><span class="queue-icon">⚑</span><div><h3>${e(f.title)}</h3><p>${e(f.id)} · ${e(f.area)} · Owner: ${e(f.owner)} · Due ${e(f.due)}</p></div><div class="right">${badge(f.severity)}</div></div>`).join('')||'<div class="empty">Nothing awaiting review.</div>'}</div>`,`<button class="text-link" onclick="nav('findings')">View all →</button>`)}${panel('The recurring work loop',`<div class="panel-pad"><div class="flow"><span>New change</span><b>→</b><span>Data map</span><b>→</b><span>Vendor / notice</span><b>→</b><span>Evidence check</span><b>→</b><span>Human sign-off</span></div><p class="panel-sub">Every new vendor, purpose, contract revision or data flow has a documented owner, traceable evidence and a review outcome.</p><button class="btn btn-dark" onclick="openChange()">Start a change review →</button></div>`)}</div><div class="stack">${panel('Readiness operations',`<div class="panel-pad"><p class="panel-sub">Operational completeness of this sample register — not a legal compliance score.</p>${[['Activities with owners',s.activities.filter(x=>x.owner).length,s.activities.length],['Vendor evidence identified',s.vendors.filter(x=>x.contract.startsWith('Provided')).length,s.vendors.length],['Findings closed',s.findings.filter(x=>x.status==='Closed').length,s.findings.length]].map(x=>`<div class="progressrow"><div class="pair"><b>${x[0]}</b><span>${x[1]}/${x[2]}</span></div><div class="progress"><i style="width:${x[2]?x[1]/x[2]*100:0}%"></i></div></div>`).join('')}<div class="aside-note"><b>Working principle</b><br/>Incomplete evidence means "not established", never an automatic violation.</div></div>`)}${panel('This week',`<div class="panel-pad"><ul class="checklist"><li><span class="dot"></span>Confirm notice purposes for analytics</li><li><span class="dot"></span>Request contract for TicketWay</li><li><span class="dot"></span>Clarify InsightBeacon's processing role</li><li><span class="dot"></span>Export change-review report</li></ul></div>`)}</div></div>`}
function processing(){let rows=s.activities.filter(x=>JSON.stringify(x).toLowerCase().includes(filter.toLowerCase()));return heading('Data lifecycle','Processing register','What data is collected, why, where it goes, and who owns the activity.',`<button class="btn btn-primary" onclick="openActivity()">＋ Add activity</button>`)+panel(`Processing activities <span class="fine">(${rows.length})</span>`,`<div class="toolbar"><input aria-label="Search activities" placeholder="Search activity, system, purpose..." value="${e(filter)}" oninput="setFilter(this.value)"/><span class="fine">Manual documented map — not automatic data discovery</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Activity</th><th>Purpose / personal data</th><th>System / recipient</th><th>Owner</th><th>Review</th></tr></thead><tbody>${rows.map(x=>`<tr><td><button class="text-link" onclick="showActivity('${x.id}')">${e(x.name)}</button><div class="fine">${e(x.id)}</div></td><td><b>${e(x.purpose)}</b><div class="fine">${e(x.data)}</div></td><td>${e(x.system)}<div class="fine">→ ${e(x.vendor)}</div></td><td>${e(x.owner)}</td><td>${badge(x.status)}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<div class="empty">No matching activities</div>'}`)}
function vendors(){let rows=s.vendors.filter(x=>JSON.stringify(x).toLowerCase().includes(filter.toLowerCase()));return heading('Third-party governance','Vendor & contract register','Maintain the links between actual processing, vendors, contract evidence and review ownership.',`<button class="btn btn-primary" onclick="openVendor()">＋ Add vendor</button>`)+panel(`Vendors <span class="fine">(${rows.length})</span>`,`<div class="toolbar"><input aria-label="Search vendors" placeholder="Search vendor, contract status..." value="${e(filter)}" oninput="setFilter(this.value)"/></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Vendor</th><th>Role classification</th><th>Contract evidence</th><th>Owner</th><th>Renewal</th><th>Status</th></tr></thead><tbody>${rows.map(v=>`<tr><td><button class="text-link" onclick="showVendor('${v.id}')">${e(v.name)}</button><div class="fine">${e(v.id)}</div></td><td>${e(v.role)}</td><td>${e(v.contract)}</td><td>${e(v.owner)}</td><td>${e(v.renewal)}</td><td>${badge(v.status)}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<div class="empty">No matching vendors</div>'}`)+`<div class="panel-pad fine">A valid processor contract is required in relevant Act s.8(2) circumstances; a separate document titled DPA is not universally prescribed. Role classification and contract sufficiency require review.</div>`}
function notices(){return heading('Policy versioning','Notice versions','Keep notice changes linked to documented processing purposes and evidence.',`<button class="btn" onclick="toast('Demo: attach a notice summary through a change request')">＋ New notice draft</button>`)+panel('Published and prior versions',`<div class="panel-pad">${s.notices.map(n=>`<div class="notice-box"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h3>${e(n.title)} · ${e(n.version)}</h3>${badge(n.status)}</div><small>${e(n.id)} · ${e(n.date)}</small><p><b>Documented purposes in demo:</b> ${e(n.purposes)}</p><div class="fine">No raw policy text supplied; this is a synthetic purpose map, not an assertion about a real published notice.</div></div>`).join('')}</div>`)+`<div style="height:16px"></div>`+panel('Change review requirement',`<div class="panel-pad"><p class="small">The synthetic register includes an analytics processing purpose absent from the purpose list attached to NOTICE-v2. The app can flag the mismatch; a reviewer must check the actual published notice and Rule 3 requirements.</p><button class="btn" onclick="showFinding('FND-001')">Open evidence-linked finding →</button></div>`)}
function changes(){return heading('The recurring product workflow','Change control','Every new vendor or new data use should trigger a documented review, not another spreadsheet.',`<button class="btn btn-primary" onclick="openChange()">＋ New change</button>`)+panel('Change requests',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Reference</th><th>Change</th><th>Type</th><th>Owner</th><th>Created</th><th>Status</th><th>Review</th></tr></thead><tbody>${s.changes.map(ch=>`<tr><td><b>${e(ch.id)}</b></td><td>${e(ch.name)}</td><td>${e(ch.type)}</td><td>${e(ch.owner)}</td><td>${e(ch.created)}</td><td>${badge(ch.status)}</td><td><button class="btn btn-sm" onclick="checkChange('${ch.id}')">Run checks</button></td></tr>`).join('')}</tbody></table></div>`)+`<div style="height:16px"></div>`+panel('How review works',`<div class="panel-pad"><div class="flow"><span>1 · Record change</span><b>→</b><span>2 · Link processing</span><b>→</b><span>3 · Check sources</span><b>→</b><span>4 · Assign fixes</span><b>→</b><span>5 · Approve</span></div><p class="fine">The checker makes no external API calls. It compares the fictional metadata entered in this browser session and returns missing-evidence suggestions rather than legal conclusions.</p></div>`)}
function findings(){let rows=s.findings.filter(x=>JSON.stringify(x).toLowerCase().includes(filter.toLowerCase()));return heading('Evidence first','Findings & remediation','Review suggested issues, resolve missing evidence and require human approval for closure.',`<button class="btn" onclick="nav('reports')">Export report ↗</button>`)+panel(`Findings <span class="fine">(${rows.length})</span>`,`<div class="toolbar"><input aria-label="Search findings" placeholder="Search findings, provision, owner..." value="${e(filter)}" oninput="setFilter(this.value)"/></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Finding / source</th><th>Area</th><th>Suggested severity</th><th>Owner</th><th>Due</th><th>Review status</th></tr></thead><tbody>${rows.map(x=>`<tr><td><button class="text-link" onclick="showFinding('${x.id}')">${e(x.title)}</button><div class="fine">${e(x.id)} · ${e(x.subject)}</div></td><td>${e(x.area)}</td><td>${badge(x.severity)}</td><td>${e(x.owner)}</td><td>${e(x.due)}</td><td>${badge(x.status)}</td></tr>`).join('')}</tbody></table></div>`)+`<div style="height:16px"></div>`+panel('Remediation actions',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Task</th><th>Finding</th><th>Owner</th><th>Due</th><th>State</th></tr></thead><tbody>${s.actions.map(a=>`<tr><td>${e(a.id)} · ${e(a.name)}</td><td>${e(a.finding)}</td><td>${e(a.owner)}</td><td>${e(a.due)}</td><td>${badge(a.status)}</td></tr>`).join('')}</tbody></table></div>`)}
function reports(){return heading('Proof of completed work','Readiness & change reports','Download an evidence index and the current open-work snapshot from this synthetic workspace.',`<button class="btn btn-dark" onclick="exportCsv()">↓ Export CSV</button>`)+`<div class="cols-2"><section class="panel"><div class="panel-head"><h2>Sample monthly readiness brief</h2></div><div class="panel-pad"><div class="eyebrow">NOVEMBER 2026 · DEMONSTRATION</div><h2 style="margin:0 0 10px;font-size:24px">MapleStack SaaS</h2><p class="panel-sub">Prepared from user-maintained sample register. Not a systems audit, opinion, compliance certification or statutory filing.</p><div class="metrics" style="grid-template-columns:repeat(3,1fr)"><div><b style="font-size:23px">${s.activities.length}</b><div class="fine">Activities</div></div><div><b style="font-size:23px">${s.vendors.length}</b><div class="fine">Vendors</div></div><div><b style="font-size:23px">${s.findings.filter(f=>f.status!=='Closed').length}</b><div class="fine">Open items</div></div></div><h3>Priority review items</h3><ol class="small">${s.findings.filter(f=>f.status!=='Closed').slice(0,5).map(f=>`<li>${e(f.title)} — ${e(f.owner)}</li>`).join('')}</ol><p class="fine"><b>Not reviewed:</b> live systems, actual controls, real documents, existing contracts, real consents, human verification and any actual client records.</p><div class="change-actions"><button class="btn btn-primary" onclick="window.print()">Print / Save PDF</button><button class="btn" onclick="exportJson()">Download JSON</button></div></div></section><section class="panel"><div class="panel-head"><h2>Report structure</h2></div><div class="panel-pad"><ul class="checklist"><li><span class="dot"></span>Scope, documents and versions reviewed</li><li><span class="dot"></span>Not reviewed and other limitations</li><li><span class="dot"></span>Evidence-linked findings and any contradictions</li><li><span class="dot"></span>Owners, due dates and unresolved actions</li><li><span class="dot"></span>Approvals and evidence chain</li><li><span class="dot"></span>Applicable rule references and commencement dates</li><li><span class="dot"></span>No legal opinion, audit or certification claim</li></ul><div class="aside-note" style="margin-top:14px">The original skills require every client-facing legal claim to be verified by a human. This demo contains proposed findings only.</div></div></section></div>`}
function setFilter(x){filter=x;let caret=document.activeElement?.selectionStart;render();let inp=document.querySelector('.toolbar input');if(inp){inp.focus();inp.setSelectionRange(Math.min(caret??x.length,x.length),Math.min(caret??x.length,x.length))}}
function modal(title,body,foot=''){ $('modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><header class="modal-head"><div><div class="eyebrow">Complira PrivacyOps</div><h2 id="modaltitle">${title}</h2></div><button class="x" aria-label="Close dialog" onclick="closeModal()">×</button></header><div class="modal-body">${body}</div><footer class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button>${foot}</footer></section></div>`;setTimeout(()=>$('modal-root').querySelector('input,select,textarea,button')?.focus(),0)}
function closeModal(){$('modal-root').innerHTML=''}
function showActivity(id){let x=s.activities.find(a=>a.id===id);if(!x)return;modal(`${e(x.name)} · ${e(x.id)}`,`<div class="kv"><b>Specified purpose</b><span>${e(x.purpose)}</span><b>Data categories</b><span>${e(x.data)}</span><b>Source system</b><span>${e(x.system)}</span><b>Destination vendor</b><span>${e(x.vendor)}</span><b>Retention record</b><span>${e(x.retention)}</span><b>Owner</b><span>${e(x.owner)}</span><b>Review state</b><span>${badge(x.status)}</span></div><div class="aside-note">These are fictional workflow records, not a scan of live systems.</div>`,`<button class="btn btn-dark" onclick="closeModal();openChange('${e(x.id)}')">Create related change →</button>`)}
function showVendor(id){let v=s.vendors.find(v=>v.id===id);if(!v)return;modal(`${e(v.name)} · ${e(v.id)}`,`<div class="kv"><b>Role</b><span>${e(v.role)}</span><b>Contract evidence</b><span>${e(v.contract)}</span><b>Linked activity</b><span>${e(v.activity)}</span><b>Owner</b><span>${e(v.owner)}</span><b>Renewal date</b><span>${e(v.renewal)}</span><b>State</b><span>${badge(v.status)}</span></div><div class="aside-note">A missing item in this *sample register* does not prove the legal document does not exist. Confirm using actual client evidence and qualified review.</div>`,`<button class="btn btn-dark" onclick="closeModal();openChange('', '${e(v.id)}')">Create vendor change →</button>`)}
function showFinding(id){let f=s.findings.find(x=>x.id===id);if(!f)return;modal(`${e(f.id)} · Evidence review`,`<div class="badge ${f.severity==='High'?'high':'review'}">${e(f.severity)} suggestion · ${e(f.status)}</div><h3>${e(f.title)}</h3><div class="evidence"><b>SOURCE A — SIMULATED RECORD</b>${e(f.sourceA)}</div><div class="evidence"><b>SOURCE B / ABSENCE — SIMULATED RECORD</b>${e(f.sourceB)}</div><div class="kv"><b>Legal reference</b><span>${e(f.provision)}</span><b>Assigned owner</b><span>${e(f.owner)}</span><b>Due</b><span>${e(f.due)}</span><b>Suggested next step</b><span>${e(f.action)}</span></div><label class="field" style="margin-top:17px">Evidence / reviewer note (required to resolve)<textarea id="resolution-note" maxlength="2000" placeholder="Describe which fictional document/version was reviewed and what was verified."></textarea></label><p class="fine">In the production design, only an authorized reviewer can approve closure and the evidence must be linked/versioned. This demo simulates the approval with a required note.</p>`,`<button class="btn btn-dark" ${f.status==='Closed'?'disabled':''} onclick="resolveFinding('${e(f.id)}')">Approve demo closure</button>`)}
function resolveFinding(id){let note=$('resolution-note')?.value.trim();if(!note){toast('Enter reviewer evidence note before closure');return}let f=s.findings.find(x=>x.id===id);if(!f)return;f.status='Closed';f.closureNote=note;f.closedAt='2026-11-14 (demo)';s.actions.filter(a=>a.finding===id).forEach(a=>a.status='Closed');closeModal();render();toast(`${id}: demo closure saved with a reviewer note`)}
function openActivity(){modal('Add processing activity',`<form id="form-activity" class="formgrid" onsubmit="saveActivity(event)"><label class="field span2">Activity name<input name="name" required maxlength="100" placeholder="e.g. Trial signup"/></label><label class="field span2">Purpose<input name="purpose" required maxlength="140" placeholder="What is the specific purpose?"/></label><label class="field">Data categories<input name="data" required maxlength="160" placeholder="e.g. Email, account ID"/></label><label class="field">Source system<input name="system" required maxlength="100" placeholder="e.g. Product database"/></label><label class="field">Recipient vendor<select name="vendor">${s.vendors.map(v=>`<option>${e(v.name)}</option>`).join('')}</select></label><label class="field">Owner<select name="owner"><option>Product</option><option>Engineering</option><option>Operations</option><option>Growth</option><option>Legal</option></select></label><label class="field span2">Retention description<input name="retention" maxlength="150" placeholder="State what evidence exists or Not established"/></label><button hidden type="submit" id="form-activity-submit"></button></form>`,`<button class="btn btn-primary" onclick="$('form-activity-submit').click()">Save activity</button>`)}
function saveActivity(ev){ev.preventDefault();let f=new FormData(ev.target),id='ACT-'+String(s.activities.length+1).padStart(3,'0');s.activities.push({id,name:String(f.get('name')),purpose:String(f.get('purpose')),data:String(f.get('data')),system:String(f.get('system')),vendor:String(f.get('vendor')),owner:String(f.get('owner')),retention:String(f.get('retention')||'Not established'),status:'Needs review'});closeModal();nav('processing');toast(`${id} added to fictional processing register`)}
function openVendor(){modal('Add vendor',`<form id="form-vendor" class="formgrid" onsubmit="saveVendor(event)"><label class="field span2">Vendor name<input name="name" required maxlength="110" placeholder="e.g. Metrics provider"/></label><label class="field">Role<select name="role"><option>Undetermined</option><option>Processor (provisional)</option><option>Other fiduciary (provisional)</option></select></label><label class="field">Contract status<select name="contract"><option>No agreement evidence provided</option><option>Provided · review pending</option></select></label><label class="field">Owner<select name="owner"><option>Engineering</option><option>Product</option><option>Operations</option><option>Legal</option></select></label><label class="field">Renewal date<input name="renewal" type="date" required/></label><label class="field span2">Related activity<select name="activity">${s.activities.map(a=>`<option value="${e(a.id)}">${e(a.id)} · ${e(a.name)}</option>`).join('')}</select></label><button type="submit" hidden id="form-vendor-submit"></button></form>`,`<button class="btn btn-primary" onclick="$('form-vendor-submit').click()">Save vendor</button>`)}
function saveVendor(ev){ev.preventDefault();let f=new FormData(ev.target),id='VEN-'+String(s.vendors.length+1).padStart(3,'0');s.vendors.push({id,name:String(f.get('name')),role:String(f.get('role')),contract:String(f.get('contract')),renewal:String(f.get('renewal')),owner:String(f.get('owner')),status:'Evidence missing',activity:String(f.get('activity'))});closeModal();nav('vendors');toast(`${id} added to fictional vendor register`)}
function openChange(activity='',vendor=''){modal('New processing / vendor change',`<div class="aside-note" style="margin-bottom:16px">Demonstration only. This creates an internal fictional review record; it does not modify a live notice, DPA or system.</div><form id="form-change" class="formgrid" onsubmit="saveChange(event)"><label class="field">Change type<select name="type"><option>New vendor</option><option>New data field</option><option>New purpose</option><option>Contract renewal</option><option>Updated notice</option></select></label><label class="field">Owner<select name="owner"><option>Product</option><option>Engineering</option><option>Operations</option><option>Legal</option><option>Growth</option></select></label><label class="field span2">Change description<input required name="name" maxlength="140" placeholder="e.g. Add customer feedback analytics provider"/></label><label class="field">Linked processing activity<select name="activity">${s.activities.map(a=>`<option value="${e(a.id)}" ${a.id===activity?'selected':''}>${e(a.id)} · ${e(a.name)}</option>`).join('')}</select></label><label class="field">Linked vendor<select name="vendor"><option value="">No vendor linked</option>${s.vendors.map(v=>`<option value="${e(v.id)}" ${v.id===vendor?'selected':''}>${e(v.id)} · ${e(v.name)}</option>`).join('')}</select></label><button type="submit" hidden id="form-change-submit"></button></form>`,`<button class="btn btn-primary" onclick="$('form-change-submit').click()">Create & run checks</button>`)}
function saveChange(ev){ev.preventDefault();let f=new FormData(ev.target);let id='CHG-'+String(s.changes.length+1).padStart(3,'0');let ch={id,type:String(f.get('type')),name:String(f.get('name')),owner:String(f.get('owner')),activity:String(f.get('activity')),vendor:String(f.get('vendor')),created:'2026-11-14 (demo)',status:'Needs review'};s.changes.unshift(ch);closeModal();nav('changes');checkChange(id)}
function checkChange(id){let ch=s.changes.find(c=>c.id===id);if(!ch)return;let a=s.activities.find(a=>a.id===ch.activity),v=s.vendors.find(v=>v.id===ch.vendor);let issues=[];
if(a&&a.retention==='Not established')issues.push('Retention evidence is not established for '+a.id);
if(a&&!s.notices[0].purposes.toLowerCase().includes(a.purpose.toLowerCase()))issues.push('Current notice purpose map does not contain the recorded purpose in '+a.id);
if(v&&v.contract.startsWith('No agreement'))issues.push('No valid-contract evidence recorded for '+v.id+' (absence in register is not proof of absence in reality)');
if(v&&v.role==='Undetermined')issues.push('Vendor role classification requires human review: '+v.id);
if(!issues.length)issues.push('No metadata mismatch found in existing sample records. Real-world review is still required.');
pendingReview={id,issues};
modal(`Review checks · ${e(ch.id)}`,`<p>Change: <b>${e(ch.name)}</b></p><div class="flow"><span>${e(ch.activity)}</span><b>→</b><span>${e(ch.vendor||'No linked vendor')}</span><b>→</b><span>Reviewer</span></div><h3>Deterministic metadata suggestions</h3><ul class="checklist">${issues.map(x=>`<li><span class="dot"></span>${e(x)}</li>`).join('')}</ul><div class="aside-note" style="margin-top:14px"><b>Human gate:</b> These checks do not inspect source documents or conclude that a statute was breached.</div>`,`<button class="btn btn-primary" onclick="acceptChange('${e(id)}')">Record review request</button>`)}
function acceptChange(id){let ch=s.changes.find(c=>c.id===id);if(!ch)return;ch.status='Review requested';
if(pendingReview&&pendingReview.id===id&&!ch.checksRecorded){
 let a=s.activities.find(a=>a.id===ch.activity),v=s.vendors.find(v=>v.id===ch.vendor);
 for(let msg of pendingReview.issues){
  if(msg.startsWith('No metadata mismatch'))continue;
  let findingId='FND-'+String(s.findings.length+1).padStart(3,'0');
  let provision=msg.includes('Retention')?'DPDP Act 2023, s.8(7) · applicability requires review':msg.includes('notice')?'DPDP Rules 2025, Rule 3 · effective 13 May 2027':msg.includes('contract')?'DPDP Act 2023, s.8(2) · effective 13 May 2027':'DPDP Act 2023, s.2 definitions · review required';
  s.findings.push({id:findingId,title:msg,area:'Change review · '+ch.id,severity:'Medium',status:'Needs reviewer',owner:ch.owner,due:'2026-11-28 (demo)',subject:ch.activity||ch.vendor,sourceA:(a?a.id+' · '+a.purpose:'No activity linked'),sourceB:(v?v.id+' · '+v.contract:'Notice / contractual evidence not established from this sample register'),provision,action:'Confirm actual source evidence and propose approved remediation'});
  s.actions.push({id:'TASK-'+String(s.actions.length+1).padStart(3,'0'),finding:findingId,name:'Resolve '+msg.slice(0,75),owner:ch.owner,due:'2026-11-28 (demo)',status:'Open'});
 }
 ch.checksRecorded=true;
}
pendingReview=null;closeModal();render();toast(`${id}: review request and traceable remediation tasks recorded (demo)`)}
function exportCsv(){let rows=[['Finding ID','Title','Evidence A','Evidence B / Absence','Reference','Suggested severity','Status','Owner','Due','Reviewer closure note'],...s.findings.map(f=>[f.id,f.title,f.sourceA,f.sourceB,f.provision,f.severity,f.status,f.owner,f.due,f.closureNote||''])];let csv=rows.map(r=>r.map(c=>'"'+String(c).replaceAll('"','""')+'"').join(',')).join('\r\n');saveFile('complira_demo_findings.csv',csv,'text/csv;charset=utf-8');toast('Synthetic CSV report exported')}
function exportJson(){saveFile('complira_demo_register.json',JSON.stringify({warning:'SYNTHETIC FICTIONAL DATA ONLY; NOT A LEGAL OPINION',exported:'2026-11-14 demo',...s},null,2),'application/json;charset=utf-8');toast('Synthetic JSON register exported')}
function saveFile(name,data,mime){let blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function resetDemo(){if(!confirm('Reset all fictional demo edits in this browser session?'))return;s=structuredClone(RAW);nav('overview');toast('Synthetic demo reset')}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});render();
</script></body></html>
